<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Naina Rajawat">
    <meta name="keywords" content="position, layout, datepicker, web development, HTML, CSS, frontend">
    <meta name="description" content="In this project I'm going to create a simple datepicker UI using only HTML and CSS.The goal of this project is to practice positioning, layout, and styling techniques in CSS. "  >
    <meta http-equiv="refresh" content="30">
    <meta name="title" content="Pick your next UI for your datapicker!!!">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Datepicker UI</title>
</head>
<body>
    <main>
        <nav>
            <input type="text" placeholder="dd / mm / yyyy">
            <i class="fa-solid fa-calendar"></i>
        </nav>
        <section class="calender">
            <header>
                <div class="months">
                    <p>◀</p>
                    <p>December 2022</p>
                    <p>▶</p>
                </div>
               <div class="days">
                    <p>S</p>
                    <p>M</p>
                    <p>T</p>
                    <p>W</p>
                    <p>T</p>
                    <p>F</p>
                    <p>S</p>
               </div>
            </header>
            <section class="dates">
                <section>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div>1</div>
                    <div>2</div>
                    <div>3</div>
                </section>
                <section>
                    <div>4</div>
                    <div>5</div>
                    <div>6</div>
                    <div>7</div>
                    <div>8</div>
                    <div>9</div>
                    <div>10</div>
                </section>
                <section>
                    <div>11</div>
                    <div>12</div>
                    <div>13</div>
                    <div>14</div>
                    <div>15</div>
                    <div>16</div>
                    <div>17</div>
                </section>
                <section>
                    <div>18</div>
                    <div>19</div>
                    <div>20</div>
                    <div>21</div>
                    <div>22</div>
                    <div>23</div>
                    <div>24</div>
                </section>
                <section>
                    <div>25</div>
                    <div>26</div>
                    <div>27</div>
                    <div>28</div>
                    <div>29</div>
                    <div>30</div>
                    <div>31</div>
                </section>
            </section>
        </section>
    </main>
</body>
</html>
